
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>さくなだふぁみりあ百人百色</title>

    <!-- CSS -->
    <link rel="stylesheet" href="index/SakunaFan100.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="fan-header">

        <h1>🎀 さくなだふぁみりあ百人百色 🐾</h1>

        <p>
            100人いれば、100通りの「好き」。<br>
            さくなだふぁみりあの想いを集めたお便り。
        </p>

    </header>


    <main class="fan-main">

        <!-- 今日の5人 -->
        <section class="fan-section">

            <h2>今日のおすすめふぁみりあ</h2>

            <div id="today-pick" class="fan-grid"></div>

        </section>


        <!-- 全員の一覧 -->
        <section class="fan-section">

            <h2>みんなの「好き」一覧</h2>

            <!-- カテゴリー -->
            <div
                id="category-buttons"
                class="category-buttons"
            ></div>

            <!-- 表示人数 -->
            <p
                id="result-count"
                class="result-count"
                aria-live="polite"
            ></p>

            <!-- カード一覧 -->
            <div
                id="fan-list"
                class="fan-grid"
            ></div>

        </section>


        
        <!-- 参加案内 -->
        <section class="fan-section participation-section">

            <h2>あなたの「好き」も届けませんか？</h2>

            <p>
                この展示は、ファン一人ひとりの想いを集めて
                作り上げていく企画です。
            </p>

            <p>
                好きな配信、好きな歌、心に残った思い出など、
                あなたにとっての「さくたんの好き」を聞かせてください！
            </p>

            <!-- 応募フォーム -->
            <div class="application-notice">

                <p>
                    🎀 参加者募集中！
                </p>

                <p>
                    あなたの「好き」をお待ちしています！🐾
                </p>

                <a
                    href="https://docs.google.com/forms/d/e/1FAIpQLScMyfhLOlUN0pGWbVZEtc-wgJ1fkcBdtBwnQfGAd-pVtYeVng/viewform?usp=header"
                    class="application-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    応募フォームはこちら 🐾
                </a>

            </div>

            <p class="section-description">
                ※応募内容は運営が確認したうえで掲載します。<br>
                ※応募内容が必ず掲載されるとは限りません。
            </p>

        </section>


    </main>

    <!-- JavaScript -->
    <script src="index/SakunaFan100.js"></script>

</body>
</html>
